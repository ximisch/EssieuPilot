name: EssieuPilot Steel Vector - Windows screenshot review
on:
  push:
    branches: ['design/steel-vector-original15']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  qa:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Check unchanged Original15 engine and new UI assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $web='faithful-app/backend/web'
          foreach($file in @('app.js','modern.js','original-live.js','steering_logic.js','steel-vector.js')) {
            node --check "$web/$file"
            if($LASTEXITCODE -ne 0){throw "Invalid JavaScript $file"}
          }
          foreach($file in @('logo.png','hero_reference.jpg','steering_logic.js','styles.css','modern.css')){
            if((Get-FileHash "original-ui-reference/$file").Hash -ne (Get-FileHash "$web/$file").Hash){
              throw "Protected Original15 asset changed: $file"
            }
          }
          $base=[IO.File]::ReadAllText('original-ui-reference/app.js')
          $actual=[IO.File]::ReadAllText("$web/app.js")
          if($actual -cne $base.Replace('Math.min(devicePixelRatio||1,2)','Math.min(devicePixelRatio||1,3)')){
            throw 'Original15 game code modified beyond sharper 2D canvas'
          }
          $skin=[IO.File]::ReadAllText("$web/steel-vector.js")
          foreach($token in @('sv-axles','sv-game','sv-photo-frame','sv-profiles','sv-action-tools')){
            if(-not $skin.Contains($token)){throw "Steel Vector missing $token"}
          }
          $main=[IO.File]::ReadAllText('faithful-app/backend/main.go')
          if(-not $main.Contains('/steel-vector.css') -or -not $main.Contains('/steel-vector.js')){throw 'Style assets not served'}
          Write-Host 'PASS: Original15 engine and images preserved'
      - name: Test Go backend
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          Push-Location faithful-app/backend
          try {
            go test ./...
            if($LASTEXITCODE -ne 0){throw 'Go regression tests failed'}
            go build -trimpath -o ../../out/EssieuPilotBackend.exe .
            if($LASTEXITCODE -ne 0){throw 'Backend build failed'}
          } finally {Pop-Location}
      - name: Build original Windows host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force faithful-app/host/Assets | Out-Null
          Copy-Item faithful-app/backend/web/EssieuPilot.ico faithful-app/host/Assets/EssieuPilot.ico
          dotnet publish faithful-app/host/EssieuPilot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output out
          if($LASTEXITCODE -ne 0){throw 'Windows application compilation failed'}
          & .\out\EssieuPilot.exe --ui-smoke
          if($LASTEXITCODE -ne 0){throw 'Native window smoke failed'}
      - name: Capture actual UI in Edge at 1366, 1920 and 2560
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath (Resolve-Path out/EssieuPilotBackend.exe).Path -PassThru -RedirectStandardOutput ready.txt -RedirectStandardError backend-error.txt
          try {
            $url=$null
            for($i=0;$i -lt 100;$i++){
              Start-Sleep -Milliseconds 300
              if(Test-Path ready.txt){
                $line=Select-String -Path ready.txt -Pattern '^READY http://127\.0\.0\.1:[0-9]+/' | Select-Object -First 1
                if($line){$url=([string]$line.Line).Substring(6);break}
              }
              if($p.HasExited){throw 'Backend stopped'}
            }
            if(-not $url){throw 'Backend did not start'}
            foreach($asset in @('steel-vector.css','steel-vector.js','modern.js','original-live.js','hero_reference.jpg','steel-vector-hero.webp')){
              $response=Invoke-WebRequest -Uri ($url+$asset) -UseBasicParsing
              if($response.StatusCode -ne 200){throw "Missing $asset"}
            }
            $status=Invoke-RestMethod -Uri ($url+'api/status')
            if($null -eq $status.game_running){throw 'ATS status is missing'}
            $edge=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft\Edge\Application\msedge.exe'
            if(-not(Test-Path $edge)){$edge=Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe'}
            if(-not(Test-Path $edge)){throw 'Edge missing'}
            foreach($dims in @('1366,768','1920,1080','2560,1440')){
              $slug=$dims.Replace(',','x')
              $target=Join-Path $env:GITHUB_WORKSPACE ('out/steel-vector-'+$slug+'.png')
              $profile=Join-Path $env:RUNNER_TEMP ('ep-steel-'+$slug)
              & $edge '--headless=new' '--disable-gpu' '--no-first-run' '--hide-scrollbars' '--run-all-compositor-stages-before-draw' "--user-data-dir=$profile" "--window-size=$dims" "--screenshot=$target" $url 2>&1|Out-Null
              if(-not(Test-Path $target)){throw "Screenshot not created: $slug"}
              if((Get-Item $target).Length -lt 20000){throw "Screenshot empty: $slug"}
            }
            foreach($page in @('trailers','inputs','viewer','diagnostics','updates','about')){
              $target=Join-Path $env:GITHUB_WORKSPACE ('out/steel-vector-page-'+$page+'.png')
              $profile=Join-Path $env:RUNNER_TEMP ('ep-steel-page-'+$page)
              & $edge '--headless=new' '--disable-gpu' '--no-first-run' '--hide-scrollbars' '--virtual-time-budget=2000' "--user-data-dir=$profile" '--window-size=1920,1080' "--screenshot=$target" ($url+'?sv-preview='+$page) 2>&1|Out-Null
              if(-not(Test-Path $target)){throw "Missing $page page screenshot"}
              if((Get-Item $target).Length -lt 20000){throw "Blank $page page screenshot"}
            }
            $asset=Invoke-WebRequest -Uri ($url+'steel-vector-hero.webp') -UseBasicParsing
            if($asset.Headers['Content-Type'] -notlike '*image/webp*' -or $asset.RawContentLength -lt 100000){throw 'High resolution panoramic asset missing'}
            Write-Host 'PASS: seven real pages and dashboard at three screen sizes captured'
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force}
          }
      - uses: actions/upload-artifact@v4
        with:
          name: EssieuPilot-Steel-Vector-Windows-Screenshots
          path: |
            out/steel-vector-*.png
          retention-days: 14
          if-no-files-found: error