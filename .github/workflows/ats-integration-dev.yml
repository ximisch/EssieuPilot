name: EssieuPilot Development — ATS diagnostic and physical IPC tests (NO RELEASE)

on:
  push:
    branches: ['development/ats-integration']
    paths:
      - '.github/workflows/ats-integration-dev.yml'
      - 'reconstruction/**'
      - 'integration/**'
      - 'installer/EssieuPilot-Beta.iss'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Récupérer la branche bêta
        uses: actions/checkout@v4

      - name: Go 1.23
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restaurer les sources de reconstruction vérifiées
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $segments = Get-ChildItem 'reconstruction/beta_sources.part*.b64' | Sort-Object Name
          if ($segments.Count -ne 9) { throw "Archive incomplète : $($segments.Count) segments, 9 attendus" }
          $base64 = ($segments | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          $bytes = [Convert]::FromBase64String($base64)
          [System.IO.File]::WriteAllBytes((Join-Path $pwd 'source.tar.xz'), $bytes)
          $expected = '77c2376d6f8da59093dfdd08ecc1b8f54c7ff1db1fa0b2a6efe76c4d48a0d00b'
          $actual = (Get-FileHash source.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Archive corrompue : empreinte SHA-256 inattendue $actual" }
          tar -xJf source.tar.xz
          if ($LASTEXITCODE -ne 0) { throw 'Extraction tar impossible' }
          if (-not (Test-Path 'backend/main.go')) { throw 'Source Go absente' }
          if (-not (Test-Path 'host/Program.cs')) { throw 'Hôte Windows absent' }

      - name: Récupérer les ressources officielles 1.6.2 sans les modifier
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -Force -ItemType Directory release | Out-Null
          gh release download v1.6.2 --repo $env:GITHUB_REPOSITORY --pattern 'Installer_EssieuPilot.exe' --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Impossible de récupérer la version officielle 1.6.2' }
          $sha='f8bb61b07d83e4f6e9324f07972133a3efacab233b82febd66b9304961f1e29b'
          if ((Get-FileHash release/Installer_EssieuPilot.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne $sha) { throw 'Hash officiel 1.6.2 non conforme' }
          python recover_assets.py release/Installer_EssieuPilot.exe backend/web
          if ($LASTEXITCODE -ne 0) { throw "Échec extraction interface" }
          git apply --check modern.js.patch app.js.patch
          if ($LASTEXITCODE -ne 0) { throw 'Les correctifs ne correspondent pas à la version 1.6.2' }
          git apply modern.js.patch app.js.patch
          if ($LASTEXITCODE -ne 0) { throw 'Application des correctifs impossible' }
          New-Item -Force -ItemType Directory 'host/Assets' | Out-Null
          Copy-Item backend/web/EssieuPilot.ico host/Assets/EssieuPilot.ico

      - name: Corriger le diagnostic de présence ATS et DLL
        shell: pwsh
        run: |
          python reconstruction/apply_dev_changes.py
          if ($LASTEXITCODE -ne 0) { throw 'Échec mise à jour ATS diagnostic' }
          Push-Location backend
          try {
            gofmt -w ats_windows.go ats_other.go telemetry.go telemetry_test.go
          } finally { Pop-Location }

      - name: Récupérer la DLL télémétrie épinglée SCS Hub (ne PAS installer dans ATS)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dst='out/ATS-Telemetry-ReadOnly'
          New-Item -ItemType Directory -Force $dst | Out-Null
          gh release download v0.1.3 --repo UncappingBadger/Badgers-SCS-Telemetry-Hub --pattern 'scs_telemetry_hub.dll' --dir $dst
          if ($LASTEXITCODE -ne 0) { throw 'Téléchargement télémétrie impossible' }
          $actual=(Get-FileHash "$dst/scs_telemetry_hub.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '357b97adafa8a3f9648e155fa4b07bba43a4d610d3e15b229d2cac102a817371') { throw "Empreinte DLL inattendue : $actual" }
          Invoke-WebRequest 'https://raw.githubusercontent.com/UncappingBadger/Badgers-SCS-Telemetry-Hub/main/LICENSE' -OutFile "$dst/LICENSE-SCS-Telemetry-Hub.txt"
          Write-Host 'DLL de télémétrie empaquetée seulement. Aucune installation dans les plugins ATS.'

      - name: Restaurer le nouveau contrôleur Go de direction des remorques
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $segments = Get-ChildItem integration/go_sources.part*.b64 | Sort-Object Name
          if ($segments.Count -ne 3) {throw "Expected 3 source parts, got $($segments.Count)"}
          $encoded = ($segments | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          $archive = [Convert]::FromBase64String($encoded)
          [System.IO.File]::WriteAllBytes((Join-Path $pwd 'go_bridge.tar.xz'),$archive)
          $sha = (Get-FileHash go_bridge.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sha -ne 'bb19be39dad57492951f20b0127de509452bbf3047f99c1bcc931c1a4e3bc1e1') {throw "Unexpected steering source digest $sha"}
          tar -xJf go_bridge.tar.xz -C backend
          if ($LASTEXITCODE -ne 0) {throw 'Cannot extract bridge sources'}
          python integration/bridge/patch_go_backend.py
          if ($LASTEXITCODE -ne 0) {throw 'Cannot wire Go controller to backend'}
          Push-Location backend
          try {
            gofmt -w steering_*.go main.go
          } finally { Pop-Location }

      - name: Tests du moteur et de la télémétrie
        shell: pwsh
        run: |
          Push-Location backend
          try {
            go test -v ./...
            if ($LASTEXITCODE -ne 0) { throw 'Tests Go échoués' }
            node steering_test.js
            if ($LASTEXITCODE -ne 0) { throw 'Test de simulation JS échoué' }
            node ui_telemetry_test.js
            if ($LASTEXITCODE -ne 0) { throw 'Test de connexion JS échoué' }
          } finally { Pop-Location }

      - name: Compiler moteur et fenêtre Windows
        shell: pwsh
        run: |
          New-Item -Force -ItemType Directory out | Out-Null
          Push-Location backend
          try {
            go build -o ../out/EssieuPilotBackend.exe .
            if ($LASTEXITCODE -ne 0) { throw 'Échec compilation moteur' }
          } finally { Pop-Location }
          dotnet publish host/EssieuPilot.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output out
          if ($LASTEXITCODE -ne 0) { throw 'Échec compilation fenêtre native' }
          if (-not (Test-Path out/EssieuPilot.exe)) { throw 'Application hôte manquante' }
          if (-not (Test-Path out/EssieuPilotBackend.exe)) { throw 'Moteur Windows manquant' }
          $ico = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path out/EssieuPilot.exe).Path)
          if ($null -eq $ico) { throw 'Aucune icône Windows intégrée' }
          $ico.Dispose()

