name: Créer les versions de test EssieuPilot (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - cargo-pulse-approved
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  compile-check:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Vérifier la compilation de l'interface
        run: dotnet build src/EssieuPilot/EssieuPilot.csproj --configuration Release -p:BuildNumber=5

  build-and-release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Préparer Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Installation Inno Setup échouée" }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe introuvable : $iscc" }

      - name: Compiler et publier la sixième version de test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = '${{ github.repository }}'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          foreach ($build in @(6)) {
            $tag = "v1.7.0-test.$build"
            $publishDir = Join-Path $env:GITHUB_WORKSPACE "build\test$build"
            $outputDir = Join-Path $env:GITHUB_WORKSPACE "output\test$build"
            New-Item -ItemType Directory -Force -Path $publishDir, $outputDir | Out-Null

            dotnet publish "src/EssieuPilot/EssieuPilot.csproj" --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:BuildNumber=$build --output "$publishDir"
            if ($LASTEXITCODE -ne 0) { throw "Compilation .NET de la version $tag échouée" }
            if (-not (Test-Path (Join-Path $publishDir 'EssieuPilot.exe'))) { throw 'EssieuPilot.exe manquant' }

            $env:EP_PUBLISH_DIR = $publishDir
            $env:EP_OUT_DIR = $outputDir
            $env:EP_APP_VERSION = "1.7.0-test.$build"
            & $iscc "installer/EssieuPilot-Test.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup a échoué pour $tag" }

            $installer = Join-Path $outputDir 'Installer_EssieuPilot.exe'
            if (-not (Test-Path $installer)) { throw "Installateur manquant pour $tag" }
            $checksum = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "$tag sha256=$checksum"

            gh release view "$tag" --repo $repo *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload "$tag" "$installer" --clobber --repo $repo
              if ($LASTEXITCODE -ne 0) { throw "Mise à jour GitHub Release échouée" }
            }
            else {
              gh release create "$tag" "$installer" --repo $repo --title "EssieuPilot - test de mise à jour $build" --prerelease --notes "Édition de test indépendante de la version 1.6.1. Code source public. Habillage EssieuPilot : sept onglets, profils remorque et suppression confirmée, menu Mises à jour, diagnostics explicitement non connectés à ATS ; simulation sans commandes physiques ATS ni Convoi. Pas de signature numérique."
              if ($LASTEXITCODE -ne 0) { throw "Création GitHub Release échouée pour $tag" }
            }
          }
