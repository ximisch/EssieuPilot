name: EssieuPilot Original.12 — essai physique ATS 1.62.2.2 (prerelease opt-in)

on:
  push:
    branches: ['development/original12-physical-diagnostics']
    paths:
      - 'release-trigger/original12.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: essieupilot-original12-physical-release
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout faithful original UI
        uses: actions/checkout@v4

      - name: Go 1.23
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.2'

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check original UI remains authentic and not redesigned
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($f in @('index.html','styles.css','modern.css','app.js','steering_logic.js','logo.png','hero_reference.jpg')) {
            $original=(Get-FileHash "original-ui-reference/$f" -Algorithm SHA256).Hash
            $rebuilt=(Get-FileHash "faithful-app/backend/web/$f" -Algorithm SHA256).Hash
            if($original -ne $rebuilt) {throw "Original interface changed unexpectedly: $f"}
          }
          # Exactly one intentional change in modern.js: do not override the ATS process
          # game status with the telemetry SDK connection status.
          $source=[IO.File]::ReadAllText("original-ui-reference/modern.js")
          $actual=[IO.File]::ReadAllText("faithful-app/backend/web/modern.js")
          $old="    if(status)status.textContent=connected?'● Connecté (lecture)':'● Non connecté';"
          $fixed="    // Ne jamais écraser le voyant ATS du jeu : sa source est /api/status, pas la télémétrie SCS."
          if($source.Split([string[]]@($old),[StringSplitOptions]::None).Length -ne 2) {throw 'Unexpected original telemetry renderer'}
          if($actual -cne $source.Replace($old,$fixed)) {throw 'Unexpected redesign in modern.js'}
          $live=[IO.File]::ReadAllText("faithful-app/backend/web/original-live.js")
          foreach($needle in @("aside.querySelector('.connection')?.remove()","aside.querySelector('#originalPhysicalPilotStatus')?.remove()","title.textContent = 'ATS · EN LIGNE'","title.textContent = 'ATS · HORS LIGNE'","fetch('/api/status'")) {
            if(-not $live.Contains($needle)) {throw "Original ATS status correction absent: $needle"}
          }
          $diagUI=[IO.File]::ReadAllText('faithful-app/backend/web/original-live.js')
          if(-not $diagUI.Contains('/api/physical-diagnostic') -or -not $diagUI.Contains('diagnostic-original12.json')){throw 'Original.12 report link missing'}
          $diagServer=[IO.File]::ReadAllText('faithful-app/backend/physical_diagnostic.go')
          foreach($needle in @('physicalGateReasons','LastWithManualInput','LastInGame','if !snapshot.ATSForeground','getPhysicalDiagnostic')){
            if(-not $diagServer.Contains($needle)){throw "Missing durable in-game diagnostic: $needle"}
          }
          node --check faithful-app/backend/web/original-live.js
          if($LASTEXITCODE -ne 0) {throw 'Original status script JS check failed'}
          $runtime=[IO.File]::ReadAllText('faithful-app/backend/steering_runtime_windows.go')
          if(-not $runtime.Contains('epUser32.NewProc("GetAsyncKeyState")')) {throw 'Windows keyboard input binding does not use user32.dll'}
          if(-not $runtime.Contains('physicalResearchBuildMode = "true"') -or
             -not $runtime.Contains('physicalResearchBuildMode == "true"') -or
             -not $runtime.Contains('physicalTestConsent()') -or
             -not $runtime.Contains('physical-test-consent.txt')) {
            throw 'Release must require experimental build, explicit installer consent and neutral IPC by default'
          }
          if(-not $runtime.Contains('bridge.publish(false')) {throw 'Neutral IPC disabled packet missing'}
          if(-not $live.Contains("fetch('/api/control-link'")) {throw 'Configurable binding diagnostic missing'}
          if(-not $live.Contains('epTrailerDetectionText') -or -not $live.Contains('epTrailerDetectionBadge') -or
             -not $live.Contains("fetch('/api/telemetry'") -or -not $live.Contains("fetch('/api/config'")) {
            throw 'Original.12 remorque/profile auto-detection diagnostics absent'
          }
          Write-Host 'PASS: original UI preserved; trailer detection and profile matching diagnostics added'

      - name: Test Go backend, update channel safety, compile
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'out' | Out-Null
          Push-Location 'faithful-app/backend'
          try {
            Get-ChildItem -Filter '*.go' | ForEach-Object {
              & gofmt -w $_.FullName
              if($LASTEXITCODE -ne 0){throw "gofmt failed: $($_.Name)"}
            }
            go test -v ./...
            if($LASTEXITCODE -ne 0){throw 'Backend tests failed'}
            go build -trimpath -o ../../out/EssieuPilotBackend.exe .
            if($LASTEXITCODE -ne 0){throw 'Backend build failed'}
          } finally {Pop-Location}
          if(-not(Test-Path 'out/EssieuPilotBackend.exe')){throw 'Go backend absent'}

      - name: Compile Windows host with original UI and check real form creation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force 'faithful-app/host/Assets' | Out-Null
          Copy-Item faithful-app/backend/web/EssieuPilot.ico faithful-app/host/Assets/EssieuPilot.ico
          dotnet publish faithful-app/host/EssieuPilot.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output out
          if($LASTEXITCODE -ne 0){throw 'Host compile failed'}
          if(-not(Test-Path 'out/EssieuPilot.exe')){throw 'Native Windows executable absent'}
          & .\out\EssieuPilot.exe --ui-smoke
          if($LASTEXITCODE -ne 0){throw 'Original native window did not open'}
          Write-Host 'PASS: WinForms host with original interface opens'

      - name: Test original HTTP interface and live status endpoint on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Start-Process -FilePath (Resolve-Path 'out/EssieuPilotBackend.exe').Path -PassThru -NoNewWindow -RedirectStandardOutput 'ready.txt' -RedirectStandardError 'backend-errors.txt'
          try {
            $ready=$null
            for($i=0;$i -lt 60;$i++){
              Start-Sleep -Milliseconds 300
              if(Test-Path ready.txt) {
                $match=Select-String -Path ready.txt -Pattern '^READY http://127\.0\.0\.1:[0-9]+/' | Select-Object -First 1
                if($match) {$ready=([string]$match.Line).Substring(6);break}
              }
              if($p.HasExited){throw 'Backend quit during startup'}
            }
            if(-not $ready){throw 'Backend HTTP endpoint not ready'}
            $web=Invoke-WebRequest -Uri $ready -UseBasicParsing
            if($web.StatusCode -ne 200 -or -not $web.Content.Contains('modern.css') -or -not $web.Content.Contains('original-live.js')){
              throw 'Original interface HTML not served correctly'
            }
            $status=Invoke-RestMethod -Uri ($ready+'api/status')
            if($null -eq $status.game_running -or $null -eq $status.steering_ack){
              throw 'ATS dual status API invalid'
            }
            Start-Sleep -Milliseconds 450
            $control=Invoke-RestMethod -Uri ($ready+'api/control-link')
            if(-not $control.service_running -or -not $control.ipc_ready -or $control.physical_control_enabled -or $control.dll_confirmed){
              throw 'Controller missing, IPC not ready, or unsafe physical flag enabled'
            }
            $token=[regex]::Match($web.Content,'data-token="([0-9a-f]{64})"').Groups[1].Value
            if(-not $token){throw 'Could not extract local anti-CSRF token for profile update test'}
            $profile=Invoke-RestMethod -Uri ($ready+'api/config')
            $profile.profiles[0].toggle_key='KEY:F12'
            $profile.profiles[0].left_key='KEY:KeyJ'
            $profile.profiles[0].right_key='KEY:KeyK'
            $payload=$profile|ConvertTo-Json -Depth 100
            Invoke-RestMethod -Uri ($ready+'api/config') -Method Post -Headers @{'X-ATS-Token'=$token} -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($payload)) | Out-Null
            $updated=$false
            for($i=0;$i -lt 20;$i++){
              Start-Sleep -Milliseconds 150
              $control=Invoke-RestMethod -Uri ($ready+'api/control-link')
              if($control.toggle_binding -eq 'KEY:F12' -and $control.left_binding -eq 'KEY:KeyJ' -and $control.right_binding -eq 'KEY:KeyK'){$updated=$true;break}
            }
            if(-not $updated){throw 'Custom profile key changes did not reach controller without DLL reconfiguration'}
            if($control.physical_control_enabled){throw 'Unsafe physical steering enabled during key test'}
            Write-Host 'PASS: GUI saved F12/J/K keys were applied dynamically by input controller; IPC neutral'
            $diagPath=Join-Path $env:LOCALAPPDATA 'EssieuPilot\ATS-Physical-Test\diagnostic-original12.json'
            if(Test-Path $diagPath){Remove-Item $diagPath -Force}
            $diagResponse=Invoke-WebRequest -Uri ($ready+'api/physical-diagnostic') -SkipHttpErrorCheck -UseBasicParsing
            if($diagResponse.StatusCode -ne 404){throw 'Diagnostic endpoint must not invent an in-game test'}
            $up=Invoke-RestMethod -Uri ($ready+'api/updates')
            if($up.version -ne '2.0.0-original.12' -or -not $up.feed_configured){
              throw 'In-app update service not configured'
            }
            Write-Host 'PASS: Original HTML, /api/status, /api/control-link and /api/updates on Windows'
          } finally {
            if(-not $p.HasExited){Stop-Process -Id $p.Id -Force}
          }

      - name: Test transactional DLL and SCS installer without the real game
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File integration/installer/Test-Manage-ATS-Plugins-V2.ps1
          if($LASTEXITCODE -ne 0){throw 'Faux fichiers ATS non validés par les tests de restauration'}

      - name: Checkout pinned MIT SCS SDK and MinHook for physical ATS DLL
        uses: actions/checkout@v4
        with:
          repository: dariowouters/ts-extra-utilities
          ref: 41b307496960732571de8e43100adba75cd115a1
          path: upstream-ts-extra
          submodules: recursive
          persist-credentials: false

      - name: Compile experimental SCS plugin and make SHA-256 module manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $up=(Resolve-Path 'upstream-ts-extra').Path
          cmake -S integration/physical -B physical-build -G 'Visual Studio 17 2022' -A x64 "-DTS_EXTRA_ROOT=$up"
          if($LASTEXITCODE -ne 0){throw 'R&D DLL CMake failed'}
          cmake --build physical-build --config Release --parallel 2
          if($LASTEXITCODE -ne 0){throw 'R&D DLL native C++ compilation failed'}
          $dll=Get-ChildItem 'physical-build' -Recurse -File -Filter 'EssieuPilotATS.dll'|Select-Object -First 1
          if(-not $dll){throw 'EssieuPilotATS.dll missing'}
          $cpp=[IO.File]::ReadAllText('integration/physical/EssieuPilotATS.cpp')
          foreach($needle in @('exactKnownBuild()','epbridge::read(0, requested)','candidateTrailerObject','g_possibleConvoy','g_paused','MH_EnableHook','epbridge::acknowledgeApplied')) {
            if(-not $cpp.Contains($needle)){throw "Unprotected physics path: $needle"}
          }
          $gate=[IO.File]::ReadAllText('integration/bridge/ATS162ExactBuildGate.hpp')
          if(-not $gate.Contains('EXPECTED_SHA256')){throw 'Exact ATS build fingerprint absent'}
          if($cpp.Contains('SCS_GET_MINOR_VERSION(init->common.game_version) != 62')){
            throw 'Original.10 telemetry schema/game version confusion is still present'
          }
          if(-not $cpp.Contains('telemetrySchemaMajor != 1') -or
             -not $cpp.Contains('ATS telemetry schema') -or
             -not $cpp.Contains('ep_ats162::exactKnownBuild()')){
            throw 'Native DLL is missing the corrected ATS telemetry major + exact executable SHA gates'
          }
          New-Item -ItemType Directory -Force 'physical-payload'|Out-Null
          Copy-Item -LiteralPath $dll.FullName -Destination 'physical-payload/EssieuPilotATS.dll'
          $sha=(Get-FileHash 'physical-payload/EssieuPilotATS.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          @{schema=1;game='ats';game_series='1.62';module_version='original.12-experimental-solo';files=@(@{name='EssieuPilotATS.dll';sha256=$sha})}|
            ConvertTo-Json -Depth 6|Set-Content -LiteralPath 'physical-payload/module-manifest.json' -Encoding UTF8
          Write-Host "ATS DLL SHA-256 = $sha ; compatibility = unverified experimental on exact ATS 1.62.2.2"
          Write-Host "No .scs needed for this native hook test. Physical motion NOT validated."

      - name: Build isolated Windows installer and ZIP backup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          choco install innosetup -y --no-progress
          if($LASTEXITCODE -ne 0){throw 'Inno Setup missing'}
          $iscc=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          New-Item -ItemType Directory -Force release | Out-Null
          $env:EP_PUBLISH_DIR=(Resolve-Path out).Path
          $env:EP_OUT_DIR=(Resolve-Path release).Path
          $env:EP_APP_VERSION='2.0.12'
          $env:EP_VALIDATED_DLL_PAYLOAD=''
          $env:EP_RND_PHYSICS_PAYLOAD=(Resolve-Path 'physical-payload').Path
          & $iscc 'installer/EssieuPilot-Original.iss'
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          $installer='release/Installer_EssieuPilot.exe'
          if(-not(Test-Path $installer)){throw 'Installer missing'}
          Compress-Archive -Path $installer -DestinationPath 'release/EssieuPilot_Interface_Originale_ZIP.zip' -CompressionLevel Optimal
          Expand-Archive -LiteralPath 'release/EssieuPilot_Interface_Originale_ZIP.zip' -DestinationPath 'verify'
          if((Get-FileHash $installer -Algorithm SHA256).Hash -ne (Get-FileHash 'verify/Installer_EssieuPilot.exe' -Algorithm SHA256).Hash){throw 'ZIP invalid'}
          Get-FileHash $installer -Algorithm SHA256
          # Standalone fallback: publish the EXACT same native DLL for manual tests.
          Copy-Item -LiteralPath 'physical-payload/EssieuPilotATS.dll' -Destination 'release/EssieuPilotATS.dll'
          $dllSha=(Get-FileHash 'release/EssieuPilotATS.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected=(Get-Content 'physical-payload/module-manifest.json' -Raw|ConvertFrom-Json).files[0].sha256
          if($dllSha -cne [string]$expected){throw 'Manual and automatically bundled native DLL SHA-256 mismatch'}
          $manualInfo=@'
          EssieuPilot Original.12, ATS 1.62.2.2 SOLO — EXPERIMENTAL
          Installateur conseillé : Installer_EssieuPilot.exe (DLL copiée automatiquement).
          En cas d'échec, place manuellement EssieuPilotATS.dll dans :
          <Steam>\steamapps\common\American Truck Simulator\bin\win_x64\plugins
          La DLL de la préversion Original.10 est remplacée automatiquement uniquement
          si son SHA-256 correspond à la DLL officielle. Les plugins inconnus sont protégés.
          Avant toute modification, FERME ATS. Conserve une copie de ton profil.
          Vérifie ensuite Documents\American Truck Simulator\game.log.txt pour le
          message « EssieuPilot: experimental 1.62.2.2 DLL loaded ».
          Le braquage PHYSIQUE n'est PAS validé et peut causer un crash.
          Activer explicitement l'essai seulement en SOLO, JAMAIS EN CONVOI.
          '@
          Set-Content -LiteralPath 'release/LISEZ_MOI_DLL_ORIGINAL12.txt' -Value $manualInfo -Encoding UTF8
          Get-FileHash 'release/EssieuPilotATS.dll' -Algorithm SHA256

      - name: Upload experimental Windows updater with native DLL bundled
        uses: actions/upload-artifact@v4
        with:
          name: EssieuPilot-Original-UI-test12-Physical-Windows
          path: |
            release/Installer_EssieuPilot.exe
            release/EssieuPilot_Interface_Originale_ZIP.zip
            release/EssieuPilotATS.dll
            release/LISEZ_MOI_DLL_ORIGINAL12.txt
          retention-days: 21

      - name: Publish separate test version with original UI (NOT stable)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $tag='v2.0.0-original.12'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -eq 0){throw 'Already published: refusing duplicate release'}
          $notes=@'
          # EssieuPilot Original.12 — Diagnostic persistant du braquage physique (R&D)

          Cette préversion ajoute un rapport AUTOMATIQUE pendant qu'ATS est réellement au premier plan.
          - Chaque condition bloquante est identifiée : autorisation R&D, mode manuel, DLL SDK, télémétrie SCS, attelage unique, profil/remorque, essieux et canal IPC.
          - Envoi de paquet physique et ACK sont distingués : un ACK signifie un appel DLL, JAMAIS la preuve de roues qui bougent.
          - Le dernier essai en jeu n'est pas écrasé en revenant dans EssieuPilot après Alt+Tab ou en quittant ATS.
          - Dans l'onglet Diagnostic, clic sur **Télécharger le diagnostic physique (JSON)**. Rapport local : `%LOCALAPPDATA%\EssieuPilot\ATS-Physical-Test\diagnostic-original12.json`.
          - Conserve l'installation automatique de la DLL sur ATS 1.62.2.2 y compris disque D:, empreintes SHA-256 et protection des DLL tierces. Les DLL officielles Original.10 et Original.11 copiées manuellement sont reconnues pour une migration contrôlée.
          - L'autorisation physique précédemment donnée volontairement est conservée à la mise à jour, mais jamais créée par défaut sur une installation neuve.
          - Interface et profils préservés. Cette version ne modifie PAS les fonctions de physique non validées d'ATS, ni les mods SCS.
          - SOLO UNIQUEMENT et sauvegarde du profil conseillée. Convoi et TruckersMP NON pris en charge. Un test physique peut provoquer un crash ATS.
          - Tests automatisés : backend Go, interface Windows, DLL native C++ x64, installation Inno Setup et découverte Steam. Les mouvements réels des roues ne peuvent pas être validés en CI.

          Après installation : lancer ATS SOLO, atteler une remorque, activer le mode manuel, essayer gauche/droite, puis revenir dans EssieuPilot → Diagnostic → Télécharger le JSON et envoyer le fichier.
          '@
          gh release create $tag release/Installer_EssieuPilot.exe release/EssieuPilot_Interface_Originale_ZIP.zip release/EssieuPilotATS.dll release/LISEZ_MOI_DLL_ORIGINAL12.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'EssieuPilot — Original.12 : corrections chargement DLL et installation ATS automatique (SOLO)' --prerelease --notes $notes
          if($LASTEXITCODE -ne 0){throw 'Publication failed'}
          gh release view $tag --repo $env:GITHUB_REPOSITORY
