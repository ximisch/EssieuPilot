name: Publier EssieuPilot

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vérifier le numéro de version
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          source = Path('updater.go').read_text(encoding='utf-8')
          m = re.search(r'appVersion\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"', source)
          if not m or tag != 'v' + m.group(1):
              raise SystemExit('Le tag ne correspond pas à appVersion dans updater.go')
          PYCODE
      - name: Tests Go
        run: go test ./...
      - name: Créer l’installateur Windows unique
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H windowsgui -s -w' -o Installer_EssieuPilot.exe .
      - name: Publier la mise à jour pour tous les utilisateurs
        uses: softprops/action-gh-release@v2
        with:
          files: Installer_EssieuPilot.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
