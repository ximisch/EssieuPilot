name: Publier EssieuPilot (Windows)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4
      - name: Reconstituer le fichier Windows et vérifier son intégrité
        shell: bash
        run: |
          set -euo pipefail
          xz -dc releases/v1.6.1/Installer_EssieuPilot.exe.xz > Installer_EssieuPilot.exe
          echo 'bf65000cde9e32f93011ead432a412033015ff1be128444820392eabf4280450  Installer_EssieuPilot.exe' | sha256sum -c -
          file Installer_EssieuPilot.exe
      - name: Publier la version officielle sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.1
          name: EssieuPilot
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: Installer_EssieuPilot.exe
          body: |
            Première publication d'EssieuPilot pour Windows 64 bits.

            Installeur : Installer_EssieuPilot.exe

            Fonctionnalités : interface, profils de remorques, simulation et recherche des mises à jour GitHub.

            Important : le braquage physique dans ATS et le mode Convoi ne sont pas encore validés.
            Le logiciel n'est pas signé numériquement.
