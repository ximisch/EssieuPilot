name: EssieuPilot Native - Windows build and in-app updates (test)

on:
  push:
    branches: ['development/native-windows-app']
    paths:
      - 'src/EssieuPilotNative/**'
      - 'installer/EssieuPilot-Native.iss'
      - '.github/workflows/native-windows-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: essieupilot-native-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout native application
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore, compile, and package a full Windows exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore src/EssieuPilotNative/EssieuPilotNative.csproj
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed' }
          New-Item -ItemType Directory -Force out,release | Out-Null
          dotnet publish src/EssieuPilotNative/EssieuPilotNative.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output out
          if ($LASTEXITCODE -ne 0) { throw 'Windows native publish failed' }
          if (-not (Test-Path out/EssieuPilot.exe)) { throw 'Main EssieuPilot executable missing' }
          if ((Get-Item out/EssieuPilot.exe).Length -lt 10000000) { throw 'Native installer exe suspiciously small' }
          & .\out\EssieuPilot.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native safety self-test FAILED' }
          Get-FileHash out/EssieuPilot.exe -Algorithm SHA256

      - name: Install Inno Setup for isolated Windows installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup setup failed' }
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'Inno compiler missing' }

      - name: Build Windows setup and ZIP download fallback
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          $env:EP_PUBLISH_DIR=(Resolve-Path out).Path
          $env:EP_OUT_DIR=(Resolve-Path release).Path
          $env:EP_APP_VERSION='2.0.0'
          & $iscc installer/EssieuPilot-Native.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer failed' }
          $installer='release/Installer_EssieuPilot.exe'
          if (-not (Test-Path $installer)) { throw 'Installer absent' }
          if ((Get-Item $installer).Length -lt 10000000) { throw 'Installer is unexpectedly small' }
          Compress-Archive -Path $installer -DestinationPath release/EssieuPilot_Native_Installateur_ZIP.zip -CompressionLevel Optimal
          Expand-Archive -LiteralPath release/EssieuPilot_Native_Installateur_ZIP.zip -DestinationPath verify
          if ((Get-FileHash verify/Installer_EssieuPilot.exe -Algorithm SHA256).Hash -ne (Get-FileHash $installer -Algorithm SHA256).Hash) { throw 'ZIP integrity check failed' }
          Get-FileHash $installer -Algorithm SHA256
          Get-FileHash release/EssieuPilot_Native_Installateur_ZIP.zip -Algorithm SHA256

      - name: Keep Windows test builds available for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: EssieuPilot-Native-2.0.0-test2
          path: |
            release/Installer_EssieuPilot.exe
            release/EssieuPilot_Native_Installateur_ZIP.zip
          retention-days: 21

      - name: Publish native beta without touching the stable 1.6.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag='v2.0.0-native.2'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Native test release already exists: $tag" }
          $notes=@'
          # EssieuPilot — mise à jour de la nouvelle application native (essai n°2)
          
          - Cette édition v2.0.0-native.2 peut être installée depuis le bouton Mises à jour de v2.0.0-native.1, qui effectue un téléchargement vérifié SHA-256 avant de lancer le nouvel installateur.
          - L'indicateur des mises à jour disponibles apparaît désormais dans le menu latéral.
          - Diagnostic des erreurs d'interface Windows ajouté.
          - Interface Windows UNIQUE bleu nuit/turquoise reconstruite en C# / .NET 8 : tableau de bord, profils, commandes, connexions, mises à jour, paramètres et à propos.
          - Deux voyants directement dans la fenêtre principale : ATS lancé (amtrucks.exe) et accusé de direction par la DLL expérimentale s'il existe.
          - Aucune seconde fenêtre PowerShell, aucun serveur localhost ni WebView2.
          - Mises à jour intégrées : vérification GitHub du canal natif, téléchargement direct, barre de progression, vérification SHA-256 de l'installateur, confirmation explicite puis lancement de l'installation.
          - Profils nouveaux et indépendants dans %APPDATA%\EssieuPilot-Native\profiles.json ; anciennes versions et profils non effacés.
          - Aucune DLL installée dans ATS et aucune commande physique réellement effectuée par cette édition : les paramètres et l'angle sont pour l'instant une simulation.
          - ATS 1.62 et mode Convoi : contrôle physique NON validé. Le voyant vert pilotage signale seulement un accusé récent de la DLL, pas un mouvement vérifié.
          - Test Windows automatisé OK, mais l'interface et la mise à jour doivent être testées sur un vrai PC.
          - Installateur Windows autonome non signé. Un ZIP contenant l'installateur est fourni comme téléchargement de secours.
          - Ne pas effacer l'installation stable EssieuPilot 1.6.2 ni les profils originaux.
          '@
          gh release create $tag release/Installer_EssieuPilot.exe release/EssieuPilot_Native_Installateur_ZIP.zip --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'EssieuPilot — mise à jour native v2.0.0-native.2' --prerelease --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Native test GitHub publication failed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY
